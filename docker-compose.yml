version: '3.9'

services:
  api:
    build: ./Backend
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=InvoiceDB;User Id=sa;Password=Password@123;TrustServerCertificate=True;
    depends_on:
      - db

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_invoicedb
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Password@123"
      platform: linux/amd64
    ports:
      - "1434:1433"

  frontend:
    build: ./Frontend
    ports:
      - "4200:80"
    depends_on:
      - api
