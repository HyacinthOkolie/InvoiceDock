name: InvoiceDock CI/CD

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      # SQL Server for integration tests
      #   sqlserver:
      #     image: mcr.microsoft.com/mssql/server:2022-latest
      #     env:
      #       SA_PASSWORD: "Password@123"
      #       ACCEPT_EULA: "Y"
      #     ports:
      #       - 1433:1433
      #     options: >-
      #       --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password@123' -Q 'SELECT 1' -C"
      #       --health-interval=10s
      #       --health-timeout=5s
      #       --health-retries=10

      # env:
      #   ConnectionStrings__DefaultConnection: "Server=localhost,1434;Database=InvoiceDock;User Id=sa;Password=Password@123;TrustServerCertificate=True"

      # Docker-in-Docker for building images and running Testcontainers
      docker:
        image: docker:24.0.6-dind
        options: --privileged

    steps:
      # -------- CHECKOUT ----------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------------------------
      # Backend (.NET)
      # ---------------------------
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Backend/**/*.csproj') }}

      # -------- SETUP .NET ----------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Check Docker
        run: docker info

      - name: Restore .NET dependencies
        run: dotnet restore ./Backend/Backend.sln

      - name: Build .NET API
        run: dotnet build ./Backend/Backend.sln --no-restore -c Release

      # - name: Run .NET integration tests with TestContainers
      #   run: dotnet test ./Backend/Backend.sln --configuration Release --verbosity normal

      # Run integration tests separately with proper Docker setup
      - name: Run integration tests
        env:
          DOCKER_HOST: tcp://localhost:2375
          TESTCONTAINERS_RYUK_DISABLED: true
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          # Build integration tests separately
          echo "Running basic integration tests..."
          dotnet build ./Backend/IntegrationTests/IntegrationTests.csproj --configuration Release --no-restore
          dotnet test ./Backend/IntegrationTests/IntegrationTests.csproj --configuration Release --no-build --verbosity normal
        continue-on-error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"
          retention-days: 30

      # ---------------------------
      # Frontend (Angular)
      # ---------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('Frontend/Client/package-lock.json') }}

      - name: Install frontend dependencies
        working-directory: Frontend/Client
        run: npm install

      - name: Build Angular app
        working-directory: Frontend/Client
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/Client/dist
          retention-days: 30

      # ---------------------------
      # Docker Compose Build
      # ---------------------------

      - name: Build Docker images
        run:
          docker compose build

  run-migrations:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # Checkout code
      # -------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # -------------------------
      # Install .NET 9
      # -------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x


      # -------------------------
      # Try checking DB directly
      # -------------------------
      - name: Try DB connection
        id: checkdb
        run: |
          echo "Checking if DB is reachable..."
          /opt/mssql-tools18/bin/sqlcmd -C \
            -S localhost,1434 \
            -U sa \
            -P Password@123 \
            -Q "SELECT 1" && echo "db_ok=true" >> $GITHUB_OUTPUT || echo "db_ok=false" >> $GITHUB_OUTPUT


      # -------------------------
      # Start docker-compose if DB is NOT reachable
      # -------------------------
      - name: Start docker-compose (if needed)
        if: steps.checkdb.outputs.db_ok == 'false'
        run: |
          echo "Database not reachable. Starting docker-compose..."
          docker compose -f docker-compose.yml up -d db


      # -------------------------
      # Wait for Docker SQL Server (if needed)
      # -------------------------
      - name: Wait for SQL Server (if needed)
        if: steps.checkdb.outputs.db_ok == 'false'
        run: |
          echo "Waiting for database to become ready..."
          for i in {1..30}; do
            /opt/mssql-tools18/bin/sqlcmd -C \
              -S localhost,1433 \
              -U sa \
              -P "Password@123" \
              -Q "SELECT 1" && break
            echo "Still waiting..."
            sleep 5
          done


      # -------------------------
      # Install EF Core CLI
      # -------------------------
      - name: Install EF Core Tools
        run: dotnet tool install --global dotnet-ef


      # -------------------------
      # Apply EF Core migrations
      # -------------------------
      - name: Run EF Migrations
        run: |
          echo "Applying EF Core migrations..."
          dotnet ef database update \
            --project Backend/API/API.csproj \
            --startup-project Backend/API/API.csproj
