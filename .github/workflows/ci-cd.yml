name: InvoiceDock CI/CD

on:
  push:
    branches: ["main"]
#   pull_request:
#     branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: "Password@123"
          ACCEPT_EULA: "Y"
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Password@123' -Q 'SELECT 1' -C"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🧩 Backend (.NET)
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore .NET dependencies
        run: dotnet restore backend/API

      - name: Build .NET API
        run: dotnet build backend/API --no-restore -c Release

      - name: Run .NET tests (optional)
        run: dotnet test backend/API --no-build --verbosity normal

      # 🧩 Frontend (Angular)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm install --prefix frontend/client

      - name: Build Angular app
        run: npm run build --prefix frontend/client

      # 🐳 Docker Build (optional CI check)
      - name: Build Docker images
        run: |
          docker compose build
