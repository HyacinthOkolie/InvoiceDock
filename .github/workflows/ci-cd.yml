name: InvoiceDock CI/CD

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore .NET dependencies
        run: dotnet restore ./Backend/Backend.sln

      - name: Build .NET API
        run: dotnet build ./Backend/Backend.sln --no-restore -c Release

      - name: Run .NET tests
        run: dotnet test ./Backend/Backend.sln --no-build --verbosity normal

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build Angular app
        working-directory: Frontend/Client
        run: |
          npm ci
          npm run build

      - name: Build Docker images
        run: docker compose build